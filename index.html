<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zyklus</title>

<!-- Fa in modo che, aggiunta alla schermata Home, si apra a tutto schermo
     senza la barra di Safari. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zyklus">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
/* ===========================================================================
   Palette. Le rampe del dolore e del flusso sono ordinali a tinta unica,
   verificate con lo script di validazione: monotone in luminosità, salto
   minimo fra i gradini, e il gradino più chiaro resta staccato dal fondo.
   =========================================================================== */
:root {
  color-scheme: light;
  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --ink-muted:    #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --hairline:     rgba(11,11,11,0.10);
  --accent:       #2a78d6;
  --critical:     #d03b3b;
  --bloat:        #e0a43a;

  /* dolore — rampa blu ordinale */
  --pain-0:       #f0efec;
  --pain-1:       #86b6ef;
  --pain-2:       #2a78d6;
  --pain-3:       #104281;
  --pain-0-ink:   #52514e;
  --pain-1-ink:   #0b0b0b;
  --pain-2-ink:   #ffffff;
  --pain-3-ink:   #ffffff;

  /* flusso — rampa rossa ordinale */
  --flow-1:       #ec9595;
  --flow-2:       #e34948;
  --flow-3:       #a01f1f;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --plane:      #0d0d0d;
    --surface:    #1a1a19;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --ink-muted:  #898781;
    --grid:       #2c2c2a;
    --axis:       #383835;
    --hairline:   rgba(255,255,255,0.10);
    --accent:     #3987e5;
    --critical:   #d03b3b;
    --bloat:      #d99a2b;

    /* Anche al buio la rampa va da chiaro a scuro, come alla luce: più scuro
       vuol dire più dolore, in tutte e due le modalità. Sul fondo quasi nero
       questo comprime la rampa — il gradino più scuro non può scendere fino al
       blu notte della modalità chiara, altrimenti sparirebbe. Questi tre passi
       sono i più scuri che restano leggibili: l'ultimo tiene 3,23:1 contro il
       fondo, ben sopra il minimo. Il livello 0 resta invece vicino al fondo,
       così un giorno senza dolore continua a farsi da parte. */
    --pain-0:     #2c2c2a;
    --pain-1:     #cde2fb;
    --pain-2:     #5598e7;
    --pain-3:     #256abf;
    --pain-0-ink: #c3c2b7;
    --pain-1-ink: #0b0b0b;
    --pain-2-ink: #0b0b0b;
    --pain-3-ink: #ffffff;

    /* Stessa logica per il flusso: chiaro = spotting, scuro = forte. */
    --flow-1:     #f7c3c3;
    --flow-2:     #e66767;
    --flow-3:     #bc3232;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}

body {
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  -webkit-user-select: none; user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }

.view { display: none; padding: 12px 14px 24px; max-width: 640px; margin: 0 auto; }
.view.active { display: block; }

h1 { font-size: 1.05rem; font-weight: 600; margin: 8px 0 14px; text-align: center; }
h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 10px; }

/* --- tab bar ------------------------------------------------------------- */
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; background: var(--surface);
  border-top: 1px solid var(--hairline);
  padding-bottom: env(safe-area-inset-bottom);
  backdrop-filter: saturate(180%) blur(12px);
}
#tabbar button {
  flex: 1; border: 0; background: none; color: var(--ink-muted);
  font: inherit; font-size: 0.68rem; padding: 8px 0 6px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  touch-action: manipulation;
}
#tabbar button.active { color: var(--accent); }
#tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }

/* --- cards --------------------------------------------------------------- */
.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 14px; padding: 14px; margin-bottom: 14px;
}
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 3px 0; font-size: 0.88rem; }
.row .v { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.note { font-size: 0.74rem; color: var(--ink-muted); line-height: 1.45; margin-top: 8px; }

/* --- calendario ---------------------------------------------------------- */
#monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#monthbar button {
  border: 0; background: none; color: var(--accent); font-size: 1.4rem;
  line-height: 1; padding: 6px 14px; touch-action: manipulation;
}
#monthbar button[disabled] { opacity: 0.28; }
#monthlabel { font-weight: 600; font-size: 1rem; }

.weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.weekdays div { text-align: center; font-size: 0.68rem; font-weight: 600; color: var(--ink-muted); padding-bottom: 4px; }

.day {
  position: relative; height: 50px; border-radius: 9px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; background: var(--pain-0); color: var(--pain-0-ink);
  font-size: 0.9rem; border: 2px solid transparent;
  touch-action: manipulation;
}
.day.p1 { background: var(--pain-1); color: var(--pain-1-ink); }
.day.p2 { background: var(--pain-2); color: var(--pain-2-ink); }
.day.p3 { background: var(--pain-3); color: var(--pain-3-ink); }
.day.empty { background: none; }
/* Giorno mai registrato: nessun riempimento. Così si distingue a colpo
   d'occhio da un giorno registrato con dolore zero, che invece è pieno. */
.day.nolog { background: none; color: var(--ink-2); }
.day.future { opacity: 0.32; }
.day.today { border-color: var(--accent); }
.day .flow { width: 20px; height: 5px; border-radius: 3px; background: transparent; }
/* anello di superficie da 2px fra il segno del flusso e il fondo della cella */
.day .flow.f1, .day .flow.f2, .day .flow.f3 { box-shadow: 0 0 0 2px var(--surface); }
.day .flow.f1 { background: var(--flow-1); }
.day .flow.f2 { background: var(--flow-2); }
.day .flow.f3 { background: var(--flow-3); }
.day .flow.gap { background: transparent; border: 1px dashed var(--flow-2); }
.day .dot { position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.55; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 14px; }
.legend .item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--ink-2); }
.legend .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--hairline); }
.legend .bar { width: 16px; height: 5px; border-radius: 3px; }

/* --- editor -------------------------------------------------------------- */
#sheet {
  position: fixed; inset: 0; z-index: 60; background: var(--plane);
  display: none; flex-direction: column;
}
#sheet.open { display: flex; }
#sheethead {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  border-bottom: 1px solid var(--hairline); background: var(--surface);
}
#sheethead button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 0.95rem; padding: 4px 2px; touch-action: manipulation; }
#sheethead button.primary { font-weight: 600; }
#sheettitle { font-weight: 600; font-size: 0.9rem; text-align: center; flex: 1; }
#sheetbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }

.seg { display: flex; gap: 7px; }
.seg button {
  flex: 1; border: 2px solid transparent; border-radius: 11px;
  background: var(--pain-0); color: var(--ink); font: inherit; font-size: 0.8rem;
  font-weight: 600; padding: 13px 2px; touch-action: manipulation;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.seg button .sub { font-size: 0.65rem; font-weight: 400; opacity: 0.72; }
.seg button[aria-pressed="true"] { border-color: var(--accent); }
.seg.pain button[aria-pressed="true"][data-v="0"] { background: var(--pain-0); color: var(--pain-0-ink); }
.seg.pain button[aria-pressed="true"][data-v="2"] { background: var(--pain-1); color: var(--pain-1-ink); }
.seg.pain button[aria-pressed="true"][data-v="5"] { background: var(--pain-2); color: var(--pain-2-ink); }
.seg.pain button[aria-pressed="true"][data-v="8"] { background: var(--pain-3); color: var(--pain-3-ink); }
/* Il sonno non ha una rampa di colore propria: userebbe una terza tinta sulla
   stessa schermata senza aggiungere informazione. Basta il bordo di selezione. */
.seg.sleep button[aria-pressed="true"] { background: var(--pain-0); border-color: var(--accent); }
.seg.flow button[aria-pressed="true"][data-v="1"] { background: var(--flow-1); color: #0b0b0b; }
.seg.flow button[aria-pressed="true"][data-v="2"] { background: var(--flow-2); color: #ffffff; }
.seg.flow button[aria-pressed="true"][data-v="3"] { background: var(--flow-3); color: #ffffff; }

.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 0.88rem; }
.field + .field { border-top: 1px solid var(--hairline); }
label.check { display: flex; align-items: center; gap: 11px; padding: 9px 0; font-size: 0.86rem; }
label.check + label.check { border-top: 1px solid var(--hairline); }
input[type="checkbox"] { width: 21px; height: 21px; accent-color: var(--accent); flex: none; }
input[type="text"], textarea, input[type="range"] { width: 100%; font: inherit; }
input[type="text"], textarea {
  background: var(--plane); color: var(--ink); border: 1px solid var(--hairline);
  border-radius: 9px; padding: 9px 10px; font-size: 0.88rem;
}
textarea { min-height: 64px; resize: vertical; }
input[type="range"] { accent-color: var(--accent); }

details > summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; padding: 6px 0; list-style: none; display: flex; justify-content: space-between; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "▾"; color: var(--ink-muted); }
details[open] > summary::after { content: "▴"; }

.btn {
  display: block; width: 100%; border: 1px solid var(--hairline); border-radius: 11px;
  background: var(--surface); color: var(--accent); font: inherit; font-size: 0.9rem;
  font-weight: 500; padding: 13px; margin-top: 9px; text-align: center;
  touch-action: manipulation;
}
.btn.danger { color: var(--critical); }
.btn:disabled { opacity: 0.4; }

/* --- grafici ------------------------------------------------------------- */
.chart { width: 100%; display: block; margin: 4px 0 2px; overflow: visible; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--ink-muted); font-size: 9px; font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); font-size: 9px; }
.chart .series { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .bar { fill: var(--accent); }
.chart .bar.out { fill: var(--critical); }
.chart .marker { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
/* banda di riferimento: recessiva, non è un allarme */
.chart .band { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 4 3; }
/* inizio delle mestruazioni: qui il rosso ha un significato */
.chart .onset { stroke: var(--flow-2); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .vlabel { fill: var(--ink); font-size: 9px; font-weight: 600; font-variant-numeric: tabular-nums; }

.chart-wrap { display: flex; align-items: flex-start; margin: 4px 0 2px; }
.chart-wrap .chart { margin: 0; }
.chart-wrap .yaxis { width: auto; flex: none; }
.chart-scroll { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain; scrollbar-width: none; touch-action: pan-x pan-y; }
.chart-scroll::-webkit-scrollbar { display: none; }
.chart-scroll .chart { width: auto; max-width: none; overflow: hidden; }
.chart .bar2 { fill: var(--bloat); opacity: 0.55; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.72rem; color: var(--ink-2); margin: 2px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; }
.lg-line { width: 16px; height: 0; border-top: 2px solid var(--accent); border-radius: 1px; }
.lg-bar { width: 9px; height: 10px; background: var(--bloat); opacity: 0.55; border-radius: 2px; }
.pager { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 0.78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pager button { min-width: 44px; min-height: 36px; font-size: 1.2rem; line-height: 1; border: 1px solid var(--hairline); border-radius: 10px; background: transparent; color: var(--ink); }
.pager button:disabled { opacity: 0.3; }
.chart .mens { fill: var(--flow-1); opacity: 0.18; }
.lg-start { width: 0; height: 12px; border-left: 1.5px dashed var(--flow-2); }
.lg-tick { width: 9px; height: 6px; background: var(--bloat); opacity: 0.55; border-radius: 1.5px; }
.chart-scroll .chart { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.chart .cursor { stroke: var(--ink-2); stroke-width: 1; }
.chart .cursordot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .tipbox { fill: var(--surface); stroke: var(--axis); stroke-width: 1; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.18)); }
.chart .tiptitle { fill: var(--ink); font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart .tiptext { fill: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.readout { font-size: 0.74rem; color: var(--ink-2); min-height: 1.1em; margin-top: 2px; font-variant-numeric: tabular-nums; }

.symrow { padding: 6px 0; }
.symrow + .symrow { border-top: 1px solid var(--hairline); }
.symrow .top { display: flex; justify-content: space-between; gap: 10px; font-size: 0.85rem; }
.symrow .sub { font-size: 0.7rem; color: var(--ink-muted); margin-top: 2px; }
.symrow .delta.hi { color: var(--critical); font-weight: 600; }

.empty-state { text-align: center; color: var(--ink-muted); padding: 48px 20px; font-size: 0.88rem; line-height: 1.5; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.75rem; font-variant-numeric: tabular-nums; margin-top: 8px; }
table.data th, table.data td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--hairline); }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--ink-muted); font-weight: 500; }

.banner { background: var(--surface); border: 1px solid var(--hairline); border-left: 3px solid var(--critical); border-radius: 9px; padding: 11px 12px; font-size: 0.78rem; line-height: 1.45; margin-bottom: 14px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- ====================== KALENDER ====================== -->
<section id="view-calendar" class="view active">
  <div class="banner hidden" id="backupreminder"></div>
  <div id="monthbar">
    <button id="prevmonth" data-t-aria="cal.prevMonth">‹</button>
    <span id="monthlabel"></span>
    <button id="nextmonth" data-t-aria="cal.nextMonth">›</button>
  </div>
  <div class="weekdays" id="weekdays"></div>
  <div class="grid" id="grid"></div>

  <div class="legend" id="legend"></div>

  <div class="card" id="statuscard" style="margin-top:16px"></div>
  <button class="btn" id="btn-today" data-t="cal.today"></button>
</section>

<!-- ====================== STATISTIK ====================== -->
<section id="view-stats" class="view">
  <h1 data-t="st.title"></h1>
  <div id="stats"></div>
</section>

<!-- ====================== EXPORT ====================== -->
<section id="view-export" class="view">
  <h1 data-t="ex.title"></h1>

  <div class="banner" data-t="ex.banner"></div>

  <div class="card">
    <h2 data-t="ex.content"></h2>
    <div id="exportinfo"></div>
  </div>

  <div class="card">
    <h2 data-t="ex.backup"></h2>
    <p class="note" style="margin-top:0" data-t="ex.backupNote"></p>
    <button class="btn" id="btn-json" data-t="ex.btnBackup"></button>
    <button class="btn" id="btn-import" data-t="ex.btnRestore"></button>
    <input type="file" id="file-import" accept="application/json,.json" class="hidden">
  </div>

  <div class="card">
    <h2 data-t="ex.doctor"></h2>
    <p class="note" style="margin-top:0" data-t="ex.doctorNote"></p>
    <button class="btn" id="btn-summary" data-t="ex.btnSummary"></button>
    <button class="btn" id="btn-csv" data-t="ex.btnCsv"></button>
  </div>

  <div class="card">
    <h2 data-t="ex.storage"></h2>
    <div id="storageinfo"></div>
    <button class="btn" id="btn-sample" data-t="ex.btnSample"></button>
    <button class="btn danger" id="btn-wipe" data-t="ex.btnWipe"></button>
  </div>

  <p class="note" id="version"></p>
</section>

<!-- ====================== TAGESEDITOR ====================== -->
<div id="sheet" role="dialog" aria-modal="true">
  <div id="sheethead">
    <button id="sheet-cancel" data-t="ed.cancel"></button>
    <span id="sheettitle"></span>
    <button id="sheet-save" class="primary" data-t="ed.save"></button>
  </div>
  <div id="sheetbody">

    <div class="card">
      <h2 data-t="ed.painTitle"></h2>
      <div class="seg pain" id="seg-pain"></div>
      <div class="field">
        <label for="chk-precise" data-t="ed.precise"></label>
        <input type="checkbox" id="chk-precise">
      </div>
      <div id="precise-wrap" class="hidden">
        <div class="row"><span data-t="ed.painWord"></span><span class="v" id="precise-val"></span></div>
        <input type="range" id="rng-pain" min="0" max="10" step="1" value="0">
      </div>
      <p class="note" data-t="ed.painNote"></p>
    </div>

    <div class="card">
      <h2 data-t="ed.flowTitle"></h2>
      <div class="seg flow" id="seg-flow"></div>
      <p class="note" data-t="ed.flowNote"></p>
    </div>

    <div class="card">
      <details id="symdetails">
        <summary id="symsummary"></summary>
        <div id="symlist"></div>
      </details>
      <p class="note" data-t="ed.symptomsNote"></p>
    </div>

    <div class="card">
      <h2 data-t="ed.sleepTitle"></h2>
      <div class="seg sleep" id="seg-sleep"></div>
      <p class="note" data-t="ed.sleepClear"></p>
      <p class="note" data-t="ed.sleepNote"></p>
    </div>

    <div class="card">
      <h2 data-t="ed.analgTitle"></h2>
      <label class="check"><input type="checkbox" id="chk-analg"> <span data-t="ed.analgCheck"></span></label>
      <div id="analg-wrap" class="hidden" style="margin-top:8px">
        <input type="text" id="txt-analg" data-t-ph="ed.analgPlaceholder">
      </div>
      <p class="note" data-t="ed.analgNote"></p>
    </div>

    <div class="card">
      <h2 data-t="ed.notes"></h2>
      <textarea id="txt-note" data-t-ph="ed.notesPlaceholder"></textarea>
    </div>

    <button class="btn danger hidden" id="btn-delete" data-t="ed.deleteDay"></button>
  </div>
</div>

<!-- ====================== TAB BAR ====================== -->
<nav id="tabbar">
  <button data-view="calendar" class="active">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span data-t="tabs.calendar"></span>
  </button>
  <button data-view="stats">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg>
    <span data-t="tabs.stats"></span>
  </button>
  <button data-view="export">
    <svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    <span data-t="tabs.export"></span>
  </button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
